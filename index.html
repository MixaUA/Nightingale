<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Соловейко</title>
<style>
:root{
  --sky:#F3D400;
  --ink:#000;
  --paper:#fff;
  --muted:#8c8c8c;
  --track:#2b2700;       /* незаповнена частина кільця завантаження */
  --rec:#fa183d;         /* кнопка під час розпізнавання */
  --rec-pulse:#ba1f24;   /* кільце пульсації */
  --bleed:10px;          /* на скільки малюнок виходить за екран з кожного боку */
}
*{box-sizing:border-box}
html{background:var(--ink);color-scheme:dark}
body{
  margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--ink);color:var(--paper);
  font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

/* ---------- шапка ---------- */
.hero{
  flex:none;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
  /* чорна смужка внизу — щоб на дробових розмірах не просвічувало небо */
  background:linear-gradient(var(--sky) calc(100% - 4px),var(--ink) 0);
}
/* малюнок ширший за екран на --bleed з кожного боку: краї пагорба йдуть за межі */
.hero-inner{position:relative;margin:0 calc(var(--bleed) * -1)}
#art{display:block;width:100%;height:auto}
/* рухомі частини (клюв і ноти) — окремий маленький шар поверх малюнка:
   під час анімації перемальовується лише він, а не весь пагорб із травою */
#voice{position:absolute;left:53.6231%;top:27.5171%;width:14.1113%;height:auto;pointer-events:none}
.note{opacity:0}

/* ---------- сторінка під шапкою ---------- */
main{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(40px,9vw,56px);
  padding:clamp(32px,8vw,48px) 16px calc(56px + env(safe-area-inset-bottom,0px));
}
#result{
  width:300px;max-width:100%;height:48px;padding:0 14px;
  display:flex;align-items:center;overflow:hidden;
  background:var(--ink);color:var(--paper);
  border:2px solid var(--sky);border-radius:12px;
  font:inherit;user-select:text;
}
/* вікно, у якому рухається текст: згасає лише воно, а рамка лишається цілою */
#clip{flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center}
#run{display:flex;flex:none;white-space:pre}
#run span{flex:none}
/* довгий текст: ходить по колу, краї плавно зникають */
#result.scroll{padding:0}
#result.scroll #clip{
  justify-content:flex-start;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#listen:focus-visible,#download:focus-visible{
  outline:3px solid var(--paper);outline-offset:4px;
}
#listen{
  position:relative;display:grid;place-items:center;
  width:min(23vw,95px);aspect-ratio:1;border:0;border-radius:50%;padding:0;
  background:var(--sky);color:var(--paper);cursor:pointer;
  font:600 clamp(16px,5vw,22px)/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
#listen:disabled{cursor:default}
/* без квадрата-підсвічування, який мобільні браузери малюють при дотику */
html{-webkit-tap-highlight-color:transparent}
#listen,#download{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#listen:focus:not(:focus-visible),#download:focus:not(:focus-visible){outline:none}
#listen.dim{opacity:.4}
/* розпізнавання: червоний диск, кільце пульсує, всередині білий мікрофон */
#listen.rec{background:transparent}
#listen.rec::before,#listen.rec::after{content:"";position:absolute;inset:0;border-radius:50%}
#listen.rec::before{z-index:0;background:var(--rec-pulse);animation:rec-pulse 1500ms ease-out infinite}
#listen.rec::after{z-index:1;background:var(--rec)}
#listen .mic{display:block;position:relative;z-index:3;width:44%;height:44%;color:var(--ink)}
#listen.loading .mic{display:none}
#listen.rec .mic{color:var(--paper)}
/* розпізнавання файлу: не слухаємо, а «читаємо» — лупа замість мікрофона */
#listen .lens{display:none}
#listen.read .mic{display:none}
#listen.read .lens{display:block;position:relative;z-index:3;width:44%;height:44%;color:var(--paper);
  animation:lens-read 1600ms ease-in-out infinite}
/* лупа «читає»: плавно їздить вліво-вправо в межах кнопки (±22% власної ширини ≈ ±10% кнопки) */
@keyframes lens-read{
  0%,100%{transform:translateX(-22%)}
  50%{transform:translateX(22%)}
}
@keyframes rec-pulse{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(1.5);opacity:0}
}
@media (prefers-reduced-motion:reduce){#listen.rec::before{animation:none;opacity:0}#listen.read .lens{animation:none}}
/* завантаження: кільце заповнюється за відсотками, число всередині */
#listen.loading{background:conic-gradient(var(--sky) calc(var(--p,0) * 1%),var(--track) 0)}
#listen.loading::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink)}
#pct{position:relative;display:none}
#listen.loading #pct{display:block}
#download{
  display:grid;place-items:center;width:56px;height:56px;padding:0;
  background:none;border:0;border-radius:50%;color:var(--paper);cursor:pointer;
}
#download svg{width:34px;height:34px;display:block}
#download:disabled{opacity:.35;cursor:default}
</style>
</head>

  <button id="download" type="button" aria-label="Розпізнати аудіофайл" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script>

const els = {
  btn:  document.getElementById('listen'),
  pct:  document.getElementById('pct'),
  res:  document.getElementById('result'),
  file: document.getElementById('download'),
  pick: document.getElementById('audioIn')
};

const ui = (function () {
  // --- анімація шапки: клюв і ноти (скрипт, а не CSS, щоб малюнок не розмивався) ---
  var beak = document.getElementById('Beak_Bottom');
  var notes = [1, 2, 3, 4].map(function (n) { return document.getElementById('Music_' + n); });
  var STEP = 800, CYCLE = STEP * 4, BEAK_OPEN = 12, PIVOT = '776 451';
  var raf = 0, t0 = -1, still = false, animating = false, lastAngle = null, lastOp = [];

  // ноти: швидко з'являється, одразу починає згасати, а до появи наступної вже напівпрозора
  function noteOpacity(t, i) {
    var p = t - i * STEP;
    if (p < 0) return 0;
    var u = (p % CYCLE) / CYCLE;
    if (u < 0.07) { var x = u / 0.07; return 1 - (1 - x) * (1 - x); }
    if (u < 0.56) return 1 - (u - 0.07) / 0.49;
    return 0;
  }
  function frame(now) {
    if (t0 < 0) t0 = now;
    var t = now - t0;
    if (!still) {
      var a = BEAK_OPEN * (0.5 - 0.5 * Math.cos(2 * Math.PI * (t % STEP) / STEP));
      a = Math.round(a * 20) / 20;
      if (a !== lastAngle) { lastAngle = a; beak.setAttribute('transform', 'rotate(' + a + ' ' + PIVOT + ')'); }
    }
    for (var i = 0; i < notes.length; i++) {
      var o = Math.round(noteOpacity(t, i) * 50) / 50;
      if (o !== lastOp[i]) { lastOp[i] = o; notes[i].style.opacity = o; }
    }
    raf = requestAnimationFrame(frame);
  }

  // --- текстовий рядок: коротке стоїть по центру, довге ходить по колу ---
  var box = els.res, run = document.getElementById('run'), sr = document.getElementById('srText');
  var DOT = '\u2003•\u2003', SPEED = 45;           // крапка з відступами (розділювач між колами) і швидкість, px/с
  var cur = '', unitW = 0, off = 0, mraf = 0, mlast = 0;

  function mStop() { cancelAnimationFrame(mraf); mraf = 0; }
  function mFrame(now) {
    var dt = Math.min(now - mlast, 100); mlast = now;
    off = (off + SPEED * dt / 1000) % unitW;
    run.style.transform = 'translateX(' + (-off).toFixed(2) + 'px)';
    mraf = requestAnimationFrame(mFrame);
  }
  function showStatic() { mStop(); box.classList.remove('scroll'); run.style.transform = ''; }
  // keep=true: позицію не скидаємо (текст лише подовжився, або це «біжать» крапки)
  function setText(raw, keep) {
    var t = raw.replace(/~/g, DOT);                // «~» (кінець речення) показуємо крапкою з тими самими відступами
    if (!keep && !(cur && t.indexOf(cur) === 0)) off = 0;
    cur = t;
    run.textContent = '';
    var u = document.createElement('span');
    u.textContent = t.replace(/^\u2003|\u2003$/g, ''); run.appendChild(u);   // по центру крайні відступи не потрібні
    if (u.getBoundingClientRect().width <= box.clientWidth - 28) { showStatic(); return; }   // вміщується
    u.textContent = t.slice(-DOT.length) === DOT ? t : t + DOT;   // текст уже закінчується крапкою: вона й є розділювачем між колами
    // два однакових «кола» підряд: шов непомітний
    run.appendChild(u.cloneNode(true));
    unitW = u.getBoundingClientRect().width;
    if (!(unitW > 0)) { showStatic(); return; }
    box.classList.add('scroll');
    off = off % unitW;
    if (!mraf) { mlast = performance.now(); mraf = requestAnimationFrame(mFrame); }
  }
  window.addEventListener('resize', function () { if (cur) setText(cur, true); });

  var timer = 0, base = '', dots = 0;
  function paint() { setText(base + '.'.repeat(dots) + '\u2008'.repeat(3 - dots), true); } // \u2008 тримає ширину, щоб текст не стрибав
  var LOAD_MSG = [
    [1,   "Будимо солов'я"],
    [25,  "Солов'ї розспівуються"],
    [50,  "Настроюємо слух"],
    [75,  "Шукаємо правильну ноту"],
    [101, "Ще мить, чистимо горло"]
  ];

  function sync() {
    var s = api.state;
    els.btn.disabled = !(s === 'idle' || s === 'listening');
    els.file.disabled = s !== 'idle';
    els.btn.classList.toggle('loading', s === 'loading');
    els.btn.classList.toggle('rec', s === 'listening' || s === 'decoding');
    els.btn.classList.toggle('dim', s === 'failed');
    els.btn.classList.toggle('read', s === 'decoding');
  }

  var api = {
    state: 'loading',     // loading | idle | listening | decoding | failed
    set: function (s) { api.state = s; sync(); },

    // повідомлення з крапками, що «біжать», поки користувач чекає
    status: function (t) {
      clearInterval(timer); base = t; dots = 0; off = 0; paint(); sr.textContent = t;
      timer = setInterval(function () { dots = (dots + 1) % 4; paint(); }, 450);
    },
    // готовий текст (розпізнане, помилка, підказка); довгий ходить по колу
    say: function (t) {
      clearInterval(timer); timer = 0;
      setText(t, false); sr.textContent = t.replace(/\s*~\s*/g, '. ').trim();   // для зчитувачів екрана «~» це крапка
    },

    progress: function (f) {
      var p = Math.max(0, Math.min(100, Math.round(f * 100)));
      els.btn.style.setProperty('--p', p);
      els.pct.textContent = p + '%';
      els.btn.setAttribute('aria-label', 'Завантаження: ' + p + '%');
      var m = LOAD_MSG.find(function (x) { return p < x[0]; });

    },
    ready: function () {
      els.btn.setAttribute('aria-label', 'Розпочати розпізнавання');
      api.set('idle');
      api.say('Готово! Натисніть кнопку, щоб слухати');
    },
    fail: function (msg) {
      els.btn.setAttribute('aria-label', 'Розпізнавання недоступне');
      api.anim(false); api.set('failed'); api.say(msg);
    },

    // живе слухання: кнопка «натиснута», шапка співає
    listening: function (on) {
      if (!on && (api.state === 'decoding' || api.state === 'loading' || api.state === 'failed')) return;
      els.btn.setAttribute('aria-pressed', String(on));
      els.btn.setAttribute('aria-label', on ? 'Зупинити розпізнавання' : 'Розпочати розпізнавання');
      api.anim(on);
      api.set(on ? 'listening' : 'idle');
      if (on) api.status('Слухаю');
    },

    anim: function (on) {
      on = !!on;
      if (on === animating) return;
      animating = on;
      if (on) {
        still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        t0 = -1; lastAngle = null; lastOp = [];
        raf = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(raf);
        beak.removeAttribute('transform');
        for (var i = 0; i < notes.length; i++) notes[i].style.opacity = '';
      }
    }
  };
  return api;
})();

// зрозумілі повідомлення про проблеми з мікрофоном
function micMsg(e) {
  var n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return 'Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера й натисніть кнопку ще раз.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError')
    return 'Мікрофон не знайдено. Підключіть його й спробуйте ще раз.';
  if (n === 'NotReadableError' || n === 'AbortError')
    return 'Мікрофон зараз зайнятий іншою програмою. Закрийте її й спробуйте ще раз.';
  return 'Не вдалося увімкнути мікрофон. Спробуйте ще раз.';
}

// ===== Рушій розпізнавання (з index.html без змін у логіці) =====
const $=s=>document.querySelector(s);
const log=t=>{try{console.log(t)}catch(e){}};   // журнал тепер іде в консоль браузера
// Розкладка: символ → номер коліна у вихідному записі (порядок за часом)
const MAP={' ':5,'о':35,'а':19,'н':3,'і':23,'в':11,'и':29,'т':42,'р':13,'е':4,'с':24,'к':41,'л':33,'д':45,'у':15,'м':28,'п':2,'я':9,'з':34,'ь':1,'б':12,'г':46,'й':27,'ч':40,'х':26,'ж':30,'ц':31,'ш':39,'ю':36,'є':10,'ї':22,'щ':8,'ф':38,"'":14,'ґ':18};
const SYMS=Object.keys(MAP);
const SEP='~';   // роздільник кінця тексту при зациклюванні: необов'язковий, береться з партитури, якщо там є коліно з ключем «~»
const M=24,NFFT=1024,HOPS=.02,FMIN=1000,FMAX=10000,TRIM_DB=35,FLOOR_DB=50,BAND=.25,HOP=.005,WIN=.01,NOISE_DB=12,LOW_CONF=2,REJECT_RATIO=1.4,PAD=.1;
let ctx=null,bank=null,lib=null,sig=null,src=null,rec=[],clock=null,raf=0,hl=-1,gainNode=null;
const ACCEPT_DIST_MAX=25;   // справжні коліна в журналах мають відстань до ~14 (пробіл, «ю»), шум і хибні збіги: 21–50
const DUR_MAX=1.7;   // найбільше відношення тривалості живого коліна до шаблону
const PRM={gap:1200,depth:35,hp:1000,lp:7000,side:2000,tgt:-15,pmax:.5,boost:12};   // параметри нарізки, розкодування й вирівнювання
const P=()=>PRM;
const ac=()=>ctx=ctx||(()=>{const A=window.AudioContext||window.webkitAudioContext;try{return new A({latencyHint:'playback',sampleRate:48000})}catch(e){return new A({latencyHint:'playback'})}})();
const mono=b=>{const x=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<b.length;i++)x[i]+=d[i]/b.numberOfChannels}return x};
const sy=c=>c===' '?'␣':c;
const pad=i=>String(i).padStart(2,'0');   // двозначний номер для журналу й фішок (без нього кодування падає з помилкою «pad is not defined»)
const rt=r=>isFinite(r)?r.toFixed(2):'∞';
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const ub64=s=>{const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u};

// ===== Спектр і порівняння =====
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<h;j++){const u=i+j,v=u+h,vr=re[v]*cr-im[v]*ci,vi=re[v]*ci+im[v]*cr;re[v]=re[u]-vr;im[v]=im[u]-vi;re[u]+=vr;im[u]+=vi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}
}
const HANN=new Float32Array(NFFT);for(let i=0;i<NFFT;i++)HANN[i]=.5-.5*Math.cos(2*Math.PI*i/(NFFT-1));
function buildBank(sr){
  const h2m=f=>2595*Math.log10(1+f/700),m2h=m=>700*(Math.pow(10,m/2595)-1),fmax=Math.min(FMAX,sr/2*.95),m0=h2m(FMIN),m1=h2m(fmax),pts=[];
  for(let i=0;i<M+2;i++)pts.push(m2h(m0+(m1-m0)*i/(M+1)));
  const bins=NFFT/2+1,bk=[];
  for(let m=0;m<M;m++){const l=pts[m],c=pts[m+1],r=pts[m+2],k0=Math.max(0,Math.floor(l*NFFT/sr)),k1=Math.min(bins-1,Math.ceil(r*NFFT/sr)),w=new Float32Array(k1-k0+1);
    for(let k=k0;k<=k1;k++){const f=k*sr/NFFT;w[k-k0]=Math.max(0,f<=c?(f-l)/(c-l):(r-f)/(r-c))}
    bk.push({k0,w})}
  return bk;
}
// Відбиток: обрізана лог-мел-спектрограма без середнього по смугах
function features(x,sr){
  const hop=Math.round(HOPS*sr),nf=Math.floor((x.length-NFFT)/hop)+1;if(nf<3)return null;
  const re=new Float32Array(NFFT),im=new Float32Array(NFFT),pw=new Float32Array(NFFT/2+1),mel=new Float32Array(nf*M),tot=new Float32Array(nf);
  for(let f=0;f<nf;f++){
    const o=f*hop;for(let i=0;i<NFFT;i++){re[i]=x[o+i]*HANN[i];im[i]=0}
    fft(re,im);for(let k=0;k<=NFFT/2;k++)pw[k]=re[k]*re[k]+im[k]*im[k];
    let sum=0;
    for(let m=0;m<M;m++){const b=bank[m];let s=0;for(let k=0;k<b.w.length;k++)s+=b.w[k]*pw[b.k0+k];mel[f*M+m]=10*Math.log10(s+1e-12);sum+=s}
    tot[f]=10*Math.log10(sum+1e-12);
  }
  let mx=-Infinity;for(let f=0;f<nf;f++)if(tot[f]>mx)mx=tot[f];
  const noise=Array.from(tot).sort((a,b)=>a-b)[Math.floor(nf*.2)];
  let a=0,z=nf-1;
  const trim=t=>{a=0;while(a<nf&&tot[a]<t)a++;z=nf-1;while(z>a&&tot[z]<t)z--;return z-a+1};
  let n=trim(Math.max(mx-TRIM_DB,noise+10));
  // Запасний варіант: у сегменті майже немає тиші (стабільний свист), 20-й перцентиль потрапляє в саме коліно,
  // і правило «шум+10 дБ» відкидає все. Тоді обрізаємо лише за глибиною TRIM_DB від піку.
  if(n<3)n=trim(mx-TRIM_DB);
  if(n<3)return null;
  let mm=-Infinity;for(let i=a*M;i<(z+1)*M;i++)if(mel[i]>mm)mm=mel[i];
  const floor=mm-FLOOR_DB,out=new Float32Array(n*M),mean=new Float32Array(M);
  for(let f=0;f<n;f++)for(let m=0;m<M;m++){const v=Math.max(mel[(a+f)*M+m],floor);out[f*M+m]=v;mean[m]+=v/n}
  for(let f=0;f<n;f++)for(let m=0;m<M;m++)out[f*M+m]-=mean[m];
  return{f:out,n};
}
// Однобічна вартість: a — живий звук, b — шаблон. Сторонній шум лише додає енергію (a>b), тому цей бік штрафується слабше;
// брак енергії там, де має бути звук (a<b), штрафується повністю. На синтетичних перевірках із шумом це піднімало запас у ~1.3–1.4 раза
const DTW_LAM=.25;
function dtw(a,b){
  const n=a.n,m=b.n;if(n>2.5*m||m>2.5*n)return 1e6;
  const band=Math.max(Math.abs(n-m),Math.ceil(BAND*Math.max(n,m)));
  let prev=new Float64Array(m+1).fill(Infinity),cur=new Float64Array(m+1);prev[0]=0;
  for(let i=1;i<=n;i++){cur.fill(Infinity);const lo=Math.max(1,i-band),hi=Math.min(m,i+band),ao=(i-1)*M;
    for(let j=lo;j<=hi;j++){const bo=(j-1)*M;let d=0;for(let q=0;q<M;q++){const t=a.f[ao+q]-b.f[bo+q];d+=t<0?t*t:DTW_LAM*t*t}d/=M;cur[j]=d+Math.min(prev[j],prev[j-1],cur[j-1])}
    const t=prev;prev=cur;cur=t}
  return prev[m]/(n+m);
}

// ===== Єдина сегментація: її використовують і нарізка, і розкодування =====
function envelope(x,sr){
  const h=Math.round(HOP*sr),w=Math.round(WIN*sr),n=Math.max(0,Math.floor((x.length-w)/h)+1),e=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;const o=i*h;for(let j=0;j<w;j++){const v=x[o+j];s+=v*v}e[i]=10*Math.log10(s/w+1e-12)}
  return e;
}
const HP_Q=[0.5412,1.3066];   // добротності двох каскадів ФВЧ Баттерворта 4-го порядку: плоска смуга пропускання, 24 дБ на октаву
async function hpf(x,sr,f,lp){
  if(!(f>0))return x;
  const oc=new OfflineAudioContext(1,x.length,sr),s=oc.createBufferSource(),b=oc.createBuffer(1,x.length,sr);
  b.copyToChannel(x,0);s.buffer=b;
  let node=s;
  for(const q of HP_Q){const fl=oc.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;fl.Q.value=20*Math.log10(q);node.connect(fl);node=fl}   // Q у дБ
  // Верхня межа: 99.9 % енергії співу нижче 6 кГц, усе вище для детектора лише шум (шурхіт, брязкіт, шиплячі)
  if(lp>0&&lp<sr*.45){const fl=oc.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;fl.Q.value=20*Math.log10(Math.SQRT1_2);node.connect(fl);node=fl}
  node.connect(oc.destination);s.start();
  return (await oc.startRendering()).getChannelData(0);
}
async function findKnees(x,sr,p){
  const e=envelope(await hpf(x,sr,p.hp,p.lp),sr),h=Math.round(HOP*sr),w=Math.round(WIN*sr);
  let ref=-Infinity;for(const v of e)if(v>ref)ref=v;
  const noise=Array.from(e).sort((a,b)=>a-b)[Math.floor(e.length*.2)]||-120,thr=Math.max(ref-p.depth,noise+NOISE_DB),kn=[];
  let k=null,gs=-1;
  for(let i=0;i<e.length;i++){
    if(e[i]>=thr){
      if(!k){k={s:i,e:i,dip:0};kn.push(k)}
      else{
        if(gs>=0){const ms=(i-gs+1)*HOP*1000;if(ms>=p.gap){k={s:i,e:i,dip:0};kn.push(k);gs=-1;continue}if(ms>k.dip)k.dip=ms}
        k.e=i;
      }
      gs=-1;
    }else if(k&&gs<0)gs=i;
  }
  return{kn:kn.map(q=>({ss:q.s*h,se:Math.min(x.length,q.e*h+w),dip:q.dip})),thr,ref};
}
function segFeat(x,sr,k){
  const a=Math.max(0,k.ss-Math.round(PAD*sr)),z=Math.min(x.length,k.se+Math.round(PAD*sr));
  return{ft:features(x.subarray(a,z),sr),t0:a/sr,t1:z/sr,a,z};
}
function lvl(y,sr){
  let pk=0;for(let i=0;i<y.length;i++){const a=Math.abs(y[i]);if(a>pk)pk=a}
  const w=Math.round(.05*sr);let r=-Infinity;
  for(let o=0;o+w<=y.length;o+=w){let s=0;for(let j=0;j<w;j++)s+=y[o+j]*y[o+j];const d=10*Math.log10(s/w+1e-12);if(d>r)r=d}
  return{pk,r50:r};
}

// ===== Розкодування (та сама сегментація і той самий відбиток, що й для шаблонів) =====
async function decodeSig(x,p,raw){
  const sr=ctx.sampleRate,{kn}=await findKnees(x,sr,p),items=[];items.skipped=[];
  // Усе, що значно коротше за найкоротше коліно бібліотеки, вважаємо випадковим звуком (клацання, шум), як і в живому режимі.
  // raw=true вимикає цей відсів (для перевірки бібліотеки, де треба бачити всі ділянки)
  let minK=Infinity;for(const c of SYMS)minK=Math.min(minK,lib[c].ft.n*HOPS);
  const minDur=Math.max(.3,.5*minK);
  for(const k of kn){
    await new Promise(r=>setTimeout(r));
    if(!raw&&(k.se-k.ss)/sr<minDur){items.skipped.push({t:k.ss/sr,d:(k.se-k.ss)/sr});continue}
    const s=segFeat(x,sr,k),it={t0:s.t0,t1:s.t1,sym:'?',ratio:0,second:''};
    if(s.ft){
      const ds=SYMS.map(c=>[dtw(s.ft,lib[c].ft),c]).sort((a,b)=>a[0]-b[0]);
      // Фазовий пошук: кадрова сітка відбитка може бути зсунута щодо шаблону до 10 мс,
      // тому 4 найближчі кандидати перевіряються ще на 7 зсувів по 2.5 мс
      const fs=[];for(let j=1;j<8;j++){const f=features(x.subarray(s.a+j*Math.round(sr*.0025),s.z),sr);if(f)fs.push(f)}
      for(const q of ds.slice(0,4))for(const f of fs){const d=dtw(f,lib[q[1]].ft);if(d<q[0])q[0]=d}
      ds.sort((a,b)=>a[0]-b[0]);
      // ds[0][0]>=1e5: жоден шаблон не підходить за довжиною: це не коліно абетки, залишається «?»
      if(ds[0][0]<1e5){it.sym=ds[0][1];it.second=ds[1][1];it.ratio=ds[1][0]/ds[0][0]}
    }
    items.push(it);
  }
  return items;
}

// ===== Синтетичні коліна з партитури =====
// Партитура зберігає для кожного коліна набір ліній: висота і гучність у часі.
// Тут із них збирається звук (чисті тони), потім стиснення гучних нот, підсилення
// верхів і відлуння (ті самі налаштування, що були в інструменті під час збереження),
// далі гучність вирівнюється так само, як при нарізці справжнього запису.
// Після цього бібліотека виглядає так само, як зібрана з запису, тож кодування,
// розкодування й перевірки працюють без змін.

// Читання ліній одного коліна з base64.
// Формат однієї лінії: кількість точок (2 байти), перший кадр відносно початку кліпу (4 байти),
// далі на кожну точку 5 байтів: крок у кадрах (1), частота ×4 в Гц (2), гучність у сотих дБ
// відносно найгучнішої складової запису (2).
function readLines(d,n,maxAmp,fade){
  const u=ub64(d),dv=new DataView(u.buffer),tr=[];
  let off=0;
  for(let k=0;k<n;k++){
    const pn=dv.getUint16(off,true);off+=2;
    let fr=dv.getInt32(off,true);off+=4;
    const F=[],Q=[],A=[];
    for(let i=0;i<pn;i++){
      fr+=dv.getUint8(off);off+=1;
      F.push(fr);
      Q.push(dv.getUint16(off,true)/4);off+=2;
      A.push(maxAmp*Math.pow(10,dv.getInt16(off,true)/100/20));off+=2;
    }
    // Нульові точки на початку й в кінці лінії: плавний вхід і вихід, без клацань
    F.unshift(F[0]-fade);Q.unshift(Q[0]);A.unshift(0);
    F.push(F[F.length-1]+fade);Q.push(Q[Q.length-1]);A.push(0);
    tr.push({fr:F,fq:Q,am:A});
  }
  return tr;
}

// Збирання звуку коліна з ліній: кожна лінія = одна синусоїда, частота й гучність
// лінійно змінюються між точками, фаза накопичується безперервно.
function synthKnee(tr,len,fx,sc,sr){
  const out=new Float32Array(len),thr=fx.compThresh*sc.maxAmp;
  for(const t of tr){
    // Приглушення гучних ліній і підсилення верхніх (перехід 3000–5000 Гц, як в інструменті)
    const am=t.am.map((v,i)=>{
      const q=v<=thr?v:thr*Math.pow(v/thr,fx.compPower);
      const k=Math.max(0,Math.min(1,(t.fq[i]-(fx.brightHz-1000))/2000));
      return q*(1+(fx.brightGain-1)*k*k*(3-2*k));
    });
    let ph=0;
    for(let p=0;p<t.fr.length-1;p++){
      const s0=t.fr[p]*sc.hop+sc.fft/2,s1=t.fr[p+1]*sc.hop+sc.fft/2,L=s1-s0;
      for(let i=s0;i<s1;i++){
        if(i<0||i>=len)continue;
        const u=(i-s0)/L,f=t.fq[p]+(t.fq[p+1]-t.fq[p])*u,a=am[p]+(am[p+1]-am[p])*u;
        ph+=2*Math.PI*f/sr;
        out[i]+=a*Math.sin(ph);
      }
    }
  }
  return out;
}

// «Відбиток» кімнати: затихаючий шум, що з часом темнішає (власний генератор, щоб був однаковий щоразу)
function makeIR(fx,sr){
  const len=Math.floor(fx.roomSec*sr),pre=Math.floor(.01*sr),ir=new Float32Array(len);
  let seed=12345,lp=0;
  for(let i=pre;i<len;i++){
    seed=(seed*1664525+1013904223)>>>0;
    const n=seed/4294967296*2-1,t=(i-pre)/(len-pre);
    lp+=Math.max(.12,1-.88*t)*(n-lp);
    ir[i]=lp*Math.exp(-6.9*t);
  }
  return ir;
}

// Накладання відлуння (рахує браузер): чистий звук + частка відлуння
async function roomify(dry,fx,sr){
  const oc=new OfflineAudioContext(1,dry.length,sr),b=oc.createBuffer(1,dry.length,sr),s=oc.createBufferSource();
  b.copyToChannel(dry,0);s.buffer=b;
  const ir=makeIR(fx,sr),ib=oc.createBuffer(1,ir.length,sr),cv=oc.createConvolver(),w=oc.createGain();
  ib.copyToChannel(ir,0);cv.normalize=true;cv.buffer=ib;w.gain.value=fx.roomMix;
  s.connect(oc.destination);s.connect(cv);cv.connect(w);w.connect(oc.destination);s.start();
  return new Float32Array((await oc.startRendering()).getChannelData(0));
}

// ===== Живе розпізнавання з мікрофона =====
// Звук з мікрофона надходить шматками. З нього на льоту рахується гучність (так само, як
// при нарізці файлу), стежимо за порогом, і коли коліно закінчилось (тиша не коротша за
// «Паузу між колінами»), воно відразу розпізнається тим самим відбитком і тим самим DTW,
// що й розкодування файлу, а символ дописується в рядок. Отже, символ з'являється приблизно
// через довжину паузи після кінця коліна.

const LIVE_SEC=40;          // скільки секунд звуку тримаємо в пам'яті (коліно до ~11 с + запас)
let LV=null;                // стан поточного сеансу
let liveStream=null,liveNode=null,liveSp=null,liveSrc=null,liveTimer=0;

// Код «захоплювача» звуку: працює в окремому потоці й передає шматки по 1024 відліки
const LIVE_WORKLET=`
class Cap extends AudioWorkletProcessor{
  constructor(){super();this.n=4096;this.b=new Float32Array(this.n);this.k=0}
  process(inputs){
    const c=inputs[0][0];if(!c)return true;
    for(let i=0;i<c.length;i++){this.b[this.k++]=c[i];if(this.k===this.n){const o=this.b;this.b=new Float32Array(this.n);this.k=0;this.port.postMessage(o,[o.buffer])}}
    return true;
  }
}
registerProcessor('cap',Cap);`;

// Розпізнавання одного коліна: грубо-точний пошук.
// 1) DTW на подвоєному кроці кадрів (у 4 рази дешевше) для всіх шаблонів;
// 2) точний DTW лише для тих, чия груба відстань ≤ 2× найкращої (від 4 до 10 шаблонів): на тестах результат збігався з повним перебором;
// 3) вирівнювання фази кадрової сітки: найкращі шаблони порівнюються ще з трьома їхніми зсунутими варіантами (вони пораховані при побудові бібліотеки).
// Віддаємо керування сторінці (малювання, прийом звуку) без затримки таймера
const _mc=new MessageChannel();let _res=null;_mc.port1.onmessage=()=>{const r=_res;_res=null;if(r)r()};
const yieldUi=()=>new Promise(r=>{_res=r;_mc.port2.postMessage(0)});
const KMIN=4,KMAX=10,KF=2;
function decim(ft){const n=Math.floor(ft.n/2);if(n<3)return ft;const f=new Float32Array(n*M);for(let i=0;i<n;i++)for(let q=0;q<M;q++)f[i*M+q]=(ft.f[2*i*M+q]+ft.f[(2*i+1)*M+q])/2;return{f,n}}
const ft2=c=>lib[c].ft2||(lib[c].ft2=decim(lib[c].ft));
async function matchKnee(x,sr,fast){
  // Порівняння займає десятки-сотні мілісекунд; щоб бігучий рядок і кнопки не підвисали, кожні ~6 мс віддаємо керування сторінці
  let ts=performance.now();const slice=async()=>{if(performance.now()-ts>6){await yieldUi();ts=performance.now()}};
  const ft=features(x,sr);if(!ft)return null;
  await slice();
  const fd=decim(ft),co=[];
  for(const c of SYMS){co.push([dtw(fd,ft2(c)),c]);await slice()}
  co.sort((a,b)=>a[0]-b[0]);
  const kmax=fast?4:KMAX;let k=0;
  while(k<co.length&&k<kmax&&(k<Math.min(KMIN,kmax)||co[k][0]<=KF*co[0][0]))k++;
  const ds=[];
  for(const q of co.slice(0,k)){ds.push([dtw(ft,lib[q[1]].ft),q[1]]);await slice()}
  ds.sort((a,b)=>a[0]-b[0]);
  if(!fast){
    for(const q of ds.slice(0,3))for(const f of (lib[q[1]].fts||[])){const d=dtw(ft,f);if(d<q[0])q[0]=d;await slice()}
    ds.sort((a,b)=>a[0]-b[0]);
  }
  if(ds[0][0]>=1e5)return{sym:'?',second:'',ratio:0,dist:Infinity};
  return{sym:ds[0][1],second:ds[1][1],ratio:ds[1][0]/ds[0][0],dist:ds[0][0]};
}

// Початок сеансу: чистий стан, фільтр, найкоротше коліно бібліотеки
function liveReset(){
  const sr=ctx.sampleRate,p=P(),cap=Math.round(LIVE_SEC*sr);
  // Усе, що значно коротше за найкоротше коліно бібліотеки, вважаємо випадковим звуком (клацання)
  let minK=Infinity;for(const c of SYMS)minK=Math.min(minK,lib[c].ft.n*HOPS);
  // Фільтр верхніх частот (як у пошуку колін у файлі): прибирає низький гул перед підрахунком гучності
  let hp=[];
  if(p.hp>0)for(const Q of HP_Q){
    const w0=2*Math.PI*p.hp/sr,al=Math.sin(w0)/(2*Q),cs=Math.cos(w0),a0=1+al;
    hp.push({b0:(1+cs)/2/a0,b1:-(1+cs)/a0,b2:(1+cs)/2/a0,a1:-2*cs/a0,a2:(1-al)/a0,x1:0,x2:0,y1:0,y2:0});
  }
  // Смуговий фільтр 1–7 кГц для детектора: нижче 1 кГц гул і голоси, вище 7 кГц лише шум; спів лежить у 1.2–6 кГц
  if(p.lp>0&&p.lp<sr*.45){
    const w0=2*Math.PI*p.lp/sr,al=Math.sin(w0)/(2*Math.SQRT1_2),cs=Math.cos(w0),a0=1+al;
    hp.push({b0:(1-cs)/2/a0,b1:(1-cs)/a0,b2:(1-cs)/2/a0,a1:-2*cs/a0,a2:(1-al)/a0,x1:0,x2:0,y1:0,y2:0});
  }
  if(!hp.length)hp=null;
  LV={sr,p,cap,h:Math.round(HOP*sr),w:Math.round(WIN*sr),raw:new Float32Array(cap),flt:new Float32Array(cap),n:0,hp,
      E:[],eBase:0,nextHop:0,thr:null,kn:null,quiet:0,minDur:Math.max(.3,.5*minK),text:'',level:-120,songLv:[],songT:0};
}

// Прийом шматка звуку
function liveFeed(c){
  const L=LV;if(!L)return;
  let k=L.n%L.cap;
  for(let i=0;i<c.length;i++){
    const x=c[i];let y=x;
    L.raw[k]=x;
    if(L.hp)for(const f of L.hp){const u=y;y=f.b0*u+f.b1*f.x1+f.b2*f.x2-f.a1*f.y1-f.a2*f.y2;f.x2=f.x1;f.x1=u;f.y2=f.y1;f.y1=y}
    L.flt[k]=y;L.n++;if(++k===L.cap)k=0;
  }
  // Нові кроки огинаючої: гучність у дБ у вікні 10 мс з кроком 5 мс
  while(L.nextHop*L.h+L.w<=L.n){
    const o=L.nextHop*L.h;let s=0,ix=o%L.cap;
    for(let j=0;j<L.w;j++){const v=L.flt[ix];s+=v*v;if(++ix===L.cap)ix=0}
    L.E.push(10*Math.log10(s/L.w+1e-12));
    liveStep(L.nextHop);
    L.nextHop++;
  }
  // Щоб масив не ріс безкінечно, старі кроки (понад ~40 с) відкидаємо
  if(L.E.length>8000){L.E.splice(0,2000);L.eBase+=2000}
}

// Один крок стеження: поріг за останніми ~20 с, початок і кінець коліна
const HMIN=-140,HSTEP=.25,HN=640,HIST=new Uint16Array(HN);
function liveStep(i){
  const L=LV,e=L.E[i-L.eBase];
  L.level=e;
  // Поріг оновлюємо раз на 100 мс: найгучніше за останні ~20 с мінус глибина, але не нижче фону плюс запас
  if(i%20===0&&L.E.length>=100){
    // Процентилі за гістограмою (крок 0.25 дБ) замість сортування 4000 значень кожні 100 мс: у ~20 разів дешевше
    const E=L.E,end=E.length,st=Math.max(0,end-4000),cnt=end-st;
    HIST.fill(0);
    for(let q=st;q<end;q++){let b=Math.floor((E[q]-HMIN)/HSTEP);b=b<0?0:b>=HN?HN-1:b;HIST[b]++}
    // Опора: 99.5-й процентиль (≈ найгучніші 100 мс), а не абсолютний максимум: одне клацання не піднімає поріг на 20 с
    const k1=Math.floor(cnt*.995),k2=Math.floor(cnt*.2);let acc=0,ref=HMIN,noise=HMIN,gotN=false;
    for(let b=0;b<HN;b++){const c=HIST[b];if(!c)continue;acc+=c;const v=HMIN+(b+.5)*HSTEP;if(!gotN&&acc>k2){noise=v;gotN=true}if(acc>k1){ref=v;break}}
    // Після трьох прийнятих колін опора не може перевищувати їхній типовий рівень (медіана останніх п'яти) + 3 дБ:
    // кашель, грюкіт чи гучне слово довше за 100 мс більше не піднімають поріг на 20 с і не вкорочують коліна.
    // Без прийнятих колін понад 60 с повертаємось до опори за вікном.
    if(L.songLv.length>=3&&L.n-L.songT<60*L.sr){const sv=L.songLv.slice().sort((a,b)=>a-b);ref=Math.min(ref,sv[sv.length>>1]+3)}
    L.thr=Math.max(ref-L.p.depth,noise+NOISE_DB);
  }
  if(L.thr===null)return;                     // перші ~0.5 с: калібрування
  if(e>=L.thr){
    if(!L.kn)L.kn={s:i,e:i};else L.kn.e=i;
    L.quiet=0;
    // Захист від безперервного шуму: надто довгу «подію» відкидаємо
    if((i-L.kn.s)*HOP>25){log('   (відкинуто: звук триває понад 25 с без пауз)');L.kn=null}
  }else if(L.kn){
    L.quiet+=HOP*1000;
    if(L.quiet>=L.p.gap){const k=L.kn;L.kn=null;L.quiet=0;liveClose(k)}
  }
}

// Вирізає звук між кроками огинаючої a0..b0 (з відступами) і розпізнає; повертає {r,dur,dr,why}. fast: швидкий режим для перебору
async function liveTry(L,a0,b0,fast,minRatio=REJECT_RATIO){
  const dur=(b0-a0+1)*HOP+WIN;
  const pad=Math.round(PAD*L.sr),ss=a0*L.h,se=Math.min(L.n,b0*L.h+L.w);
  const a=Math.max(0,ss-pad),z=Math.min(L.n,se+pad);
  if(a<L.n-L.cap)return{dur,why:'не вмістилось у пам\'ять'};
  const x=new Float32Array(z-a);
  for(let j=0;j<x.length;j++)x[j]=L.raw[(a+j)%L.cap];
  const r=await matchKnee(x,L.sr,fast);
  if(!r)return{dur,why:'закоротке для розпізнавання'};
  if(r.sym==='?'||r.ratio<minRatio)return{r,dur,why:`не схоже на жодне коліно · запас ${rt(r.ratio)} · відстань ${r.dist>1e5?'—':r.dist.toFixed(1)} · ${dur.toFixed(2)} с`};
  if(r.dist>ACCEPT_DIST_MAX)return{r,dur,why:`занадто велика відстань до шаблону «${sy(r.sym)}» (${r.dist.toFixed(1)}), це шум; запас ${rt(r.ratio)} тут оманливий · ${dur.toFixed(2)} с`};
  // Тривалість живого коліна має збігатися з тривалістю шаблону (для правильних збігів 0.93–1.30, для злипання 1.87)
  const dr=(dur+2*PAD)/(lib[r.sym].ft.n*HOPS);
  if(dr>DUR_MAX)return{r,dur,dr,why:`коліно ${dur.toFixed(2)} с у ${dr.toFixed(2)} раза довше за шаблон «${sy(r.sym)}», схоже на злипання звуків`};
  return{r,dur,dr,why:'',a0,b0};
}
function liveAccept(L,t){
  const {r,dur,dr}=t;
  // Рівень співу: пік прийнятого коліна. За ним поріг відрізняє спів від випадкових гучних звуків (кашель, грюкіт), які не є колінами
  let pk=-Infinity;for(let q=Math.max(0,t.a0-L.eBase);q<=t.b0-L.eBase;q++){const v=L.E[q];if(v!==undefined&&v>pk)pk=v}
  if(pk>-Infinity){L.songLv.push(pk);if(L.songLv.length>5)L.songLv.shift();L.songT=L.n}
  L.text+=r.sym;ui.say(L.text);
  log(`Живе: ${sy(r.sym)} | запас ${rt(r.ratio)}${r.ratio<LOW_CONF?' ⚠ СУМНІВНО':''} | другий варіант ${sy(r.second)} | коліно ${dur.toFixed(2)} с (×${dr.toFixed(2)} шаблону) | відстань ${r.dist.toFixed(2)}`);
}

// Рятування коліна із суміші зі сторонніми звуками. Подія закривається лише після паузи gap (1.2 с), тому шум, що почався
// поруч, склеюється з коліном в один сегмент, який не схожий ні на що. Розбиваємо подію на спалахи (за паузами ≥ RESCUE_SPLIT мс),
// перебираємо суміжні групи спалахів, найкращу групу перевіряємо повним розпізнаванням; решту ліворуч і праворуч шукаємо так само.
// Кожну групу оцінюємо один раз (кеш), а між оцінками віддаємо керування, щоб сторінка й прийом звуку не зависали.
const RESCUE_SPLIT=250, RESCUE_RATIO=1.6, RESCUE_MIN_RATIO=1.25, RESCUE_DIST=16, RESCUE_MAX_BURSTS=7, RESCUE_MAX_CALLS=40, RESCUE_BUDGET_MS=2500, RESCUE_LEVELS=[0,8,16];
async function liveRescue(L,k){
  if(k.s-L.eBase<0)return false;
  const ev=L.E.slice(k.s-L.eBase,k.e-L.eBase+1),thr0=L.thr,sp=Math.round(RESCUE_SPLIT/1000/HOP);   // знімок огинаючої: масив може зсунутись, поки чекаємо
  let minT=Infinity,maxT=0;for(const c of SYMS){const t=lib[c].ft.n*HOPS;minT=Math.min(minT,t);maxT=Math.max(maxT,t)}
  let calls=0,bestFail=null;const memo=new Map(),tStart=performance.now();
  const bursts=up=>{
    let bs=[],cur=null;
    for(let q=0;q<ev.length;q++){
      if(ev[q]>=thr0+up){const i=k.s+q;if(cur&&i-cur.e<=sp)cur.e=i;else{cur={s:i,e:i};bs.push(cur)}}
    }
    bs=bs.filter(b=>(b.e-b.s+1)*HOP+WIN>=.08);                         // зовсім короткі спалахи (клацання) відкидаємо
    if(bs.length>RESCUE_MAX_BURSTS){const keep=new Set(bs.slice().sort((a,b)=>(b.e-b.s)-(a.e-a.s)).slice(0,RESCUE_MAX_BURSTS));bs=bs.filter(b=>keep.has(b))}
    return bs;
  };
  const evalG=async(a,b,full)=>{
    const key=a+'-'+b+(full?'f':'');
    if(memo.has(key))return memo.get(key);
    if(!full){if(calls>=RESCUE_MAX_CALLS||performance.now()-tStart>RESCUE_BUDGET_MS)return null;calls++}   // і за кількістю, і за часом: на повільних телефонах перебір урізається сам
    const t=await liveTry(L,a,b,!full,RESCUE_MIN_RATIO);memo.set(key,t);
    if(t.r&&t.r.sym!=='?'&&(!bestFail||t.r.ratio>bestFail.r.ratio))bestFail=t;
    return t;
  };
  // Справжній збіг: або великий запас, або (помірний запас і мала відстань до шаблону). Шум у журналах має відстань 30–50,
  // а справжні коліна, зокрема пробіл із малим запасом, до ~14, тому відстань надійно відрізняє їх там, де запас ще малий
  const okT=t=>{
    if(!t||t.why||t.dr<.7)return false;
    return t.r.ratio>=RESCUE_RATIO||(t.r.ratio>=RESCUE_MIN_RATIO&&t.r.dist<=RESCUE_DIST);
  };
  for(const up of RESCUE_LEVELS){
    const bs=bursts(up);
    if(bs.length<1||(up===0&&bs.length<2))continue;                      // на нульовому рівні розбивати нічого
    const found=[],left=[];
    const go=async arr=>{
      if(!arr.length)return;
      const cands=[];let loc=null;
      for(let i=0;i<arr.length;i++)for(let j=i;j<arr.length;j++){
        if(up===0&&i===0&&j===arr.length-1&&arr===bs)continue;           // повну подію вже пробували
        const w=(arr[j].e-arr[i].s+1)*HOP+WIN+2*PAD;
        if(w<.75*minT||w>DUR_MAX*maxT)continue;                          // довжина неможлива для жодного шаблону
        const t=await evalG(arr[i].s,arr[j].e,false);
        if(t&&t.r&&t.r.sym!=='?'&&(!loc||t.r.ratio>loc.r.ratio))loc=t;
        if(t&&okT(t))cands.push({i,j,t});
      }
      cands.sort((a,b)=>b.t.r.ratio-a.t.r.ratio);
      for(const c of cands.slice(0,3)){
        const f=await evalG(arr[c.i].s,arr[c.j].e,true);                 // підтвердження повним розпізнаванням
        if(okT(f)){found.push({s:arr[c.i].s,t:f});await go(arr.slice(0,c.i));await go(arr.slice(c.j+1));return}
      }
      const span=((arr[arr.length-1].e-arr[0].s+1)*HOP+WIN).toFixed(2);
      left.push(loc?`   (залишок ${span} с без збігу: найкращий «${sy(loc.r.sym)}» · запас ${rt(loc.r.ratio)} · відстань ${loc.r.dist.toFixed(1)} · ${loc.dur.toFixed(2)} с)`:`   (залишок ${span} с без кандидатів: довжина не підходить жодному шаблону)`);
    };
    await go(bs);
    if(found.length){
      found.sort((a,b)=>a.s-b.s);
      for(const f of found){log(`   (врятовано з-поміж сторонніх звуків${up?`, поріг +${up} дБ`:''})`);liveAccept(L,f.t)}
      left.forEach(m=>log(m));
      return true;
    }
  }
  if(bestFail)log(`   (рятування не вдалось; найближчий кандидат «${sy(bestFail.r.sym)}» · запас ${rt(bestFail.r.ratio)} · відстань ${bestFail.r.dist.toFixed(1)} · ${bestFail.dur.toFixed(2)} с)`);
  return false;
}

// Коліно закінчилось: ставимо в чергу на розпізнавання. Черга зберігає порядок символів, навіть якщо рятування триває кілька секунд
let liveQ=Promise.resolve(),liveBusyN=0;
function liveClose(k){
  const L=LV;liveBusyN++;
  liveQ=liveQ.then(()=>liveJob(L,k)).catch(e=>log('ПОМИЛКА розпізнавання: '+(e&&e.message||e))).then(()=>{liveBusyN--});
}
async function liveJob(L,k){
  const dur=(k.e-k.s+1)*HOP+WIN;
  if(dur<L.minDur){log(`   (пропущено короткий звук ${dur.toFixed(2)} с)`);return}
  const t=await liveTry(L,k.s,k.e,false);
  if(!t.why){liveAccept(L,t);return}
  // Рятування пропускаємо, якщо вимкнено або пристрій не встигає за звуком (у черзі вже кілька подій): так слабкий гаджет не відстає
  if(liveBusyN>3){log(`   (рятування пропущено: розпізнавання не встигає за звуком) (відкинуто: ${t.why})`);return}
  if(await liveRescue(L,k))return;
  log(`   (відкинуто: ${t.why})`);
}


let workletReady=false,liveBusy=false;
async function liveStart(){
  if(!lib){log('Живе розпізнавання: спершу збудуйте бібліотеку.');return false}
  if(liveStream||liveBusy)return false;
  liveBusy=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){log('ПОМИЛКА: браузер не дає mediaDevices (потрібен https)');ui.say("Браузер не дає доступ до мікрофона на цій сторінці. Потрібне захищене з'єднання (https).");return false}
    ac();await ctx.resume();
    // Вимикаємо «покращення» мікрофона: вони вирізають стабільні тони, тобто саме наш спів
    try{liveStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
    catch(e){log('ПОМИЛКА: немає доступу до мікрофона ('+(e&&e.name||e)+')');ui.say(micMsg(e));return false}
    liveReset();wlAcquire();
    liveSrc=ctx.createMediaStreamSource(liveStream);
    try{
      // Модуль реєструємо один раз на AudioContext: повторне додавання падало б і мовчки вмикало запасний шлях
      if(!workletReady){await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([LIVE_WORKLET],{type:'application/javascript'})));workletReady=true}
      liveNode=new AudioWorkletNode(ctx,'cap');
      liveNode.port.onmessage=e=>liveFeed(e.data);
      liveSrc.connect(liveNode);liveNode.connect(ctx.destination);
      log('Захоплення звуку: AudioWorklet (звук не губиться, навіть коли сторінка зайнята)');
    }catch(e){
      // Запасний шлях для середовищ без AudioWorklet
      log('Захоплення звуку: ScriptProcessor (запасний шлях: за завантаження сторінки звук може губитись)');
      liveSp=ctx.createScriptProcessor(2048,1,1);
      liveSp.onaudioprocess=ev=>liveFeed(ev.inputBuffer.getChannelData(0).slice());
      liveSrc.connect(liveSp);liveSp.connect(ctx.destination);
    }
    ui.listening(true);
    log(`\n-- Живе розпізнавання: слухаю (${ctx.sampleRate} Гц, пауза між колінами ${LV.p.gap} мс, найкоротше коліно бібліотеки ≈ ${(LV.minDur*2).toFixed(2)} с) --`);
    return true;
  }finally{liveBusy=false}
}
function liveStop(){
  const wasLive=!!liveStream;
  // Відкрите коліно (звук ще йшов у момент зупинки) дорозпізнаємо, а не губимо
  if(liveStream&&LV&&LV.kn){const k=LV.kn;LV.kn=null;LV.quiet=0;try{liveClose(k)}catch(e){}}
  wlRelease();
  clearInterval(liveTimer);
  try{if(liveNode){liveNode.disconnect();liveNode.port.onmessage=null}if(liveSp){liveSp.disconnect();liveSp.onaudioprocess=null}if(liveSrc)liveSrc.disconnect()}catch(e){}
  if(liveStream)liveStream.getTracks().forEach(t=>t.stop());
  liveNode=liveSp=liveSrc=liveStream=null;
  ui.listening(false);
  const Ls=LV;liveQ=liveQ.then(()=>{log(`-- Живе розпізнавання зупинено. Текст: «${Ls?Ls.text:''}» --`);
    if(wasLive&&!(Ls&&Ls.text)&&!liveStream&&ui.state==='idle')ui.say("Нічого не розпізнано. Піднесіть пристрій ближче до звуку й спробуйте ще раз.")});
}

// ===== Екран не гасне під час слухання =====
// Спершу штатний Screen Wake Lock API (потрібен HTTPS: GitHub Pages підходить). Якщо його немає або браузер відмовив,
// вмикаємо запасний шлях: майже невидиме беззвучне відео з canvas, яке система вважає відтворенням медіа.
// Жодних дотиків до екрана не потрібно, тож вони більше не псують розпізнавання.
const WL={lock:null,vid:null,cv:null,tick:0,want:false};
const holdSt=t=>{if(t)log('Екран: '+t)};
function wlVideoStart(){
  try{
    if(!WL.vid){
      const c=document.createElement('canvas');c.width=c.height=32;
      if(!c.captureStream)return false;
      const v=document.createElement('video');
      v.muted=true;v.defaultMuted=true;v.loop=true;v.autoplay=true;
      v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
      v.style.cssText='position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.02;pointer-events:none;z-index:-1';
      v.srcObject=c.captureStream(4);
      document.body.appendChild(v);
      WL.vid=v;WL.cv=c;
    }
    const g=WL.cv.getContext('2d');let f=0;
    clearInterval(WL.tick);
    // Кадр має змінюватись, інакше потік «завмирає» і система може вважати відео неактивним
    WL.tick=setInterval(()=>{f^=1;g.fillStyle=f?'#000':'#020202';g.fillRect(0,0,32,32)},250);
    const p=WL.vid.play();if(p&&p.catch)p.catch(()=>{});
    return true;
  }catch(e){return false}
}
function wlVideoStop(){clearInterval(WL.tick);WL.tick=0;if(WL.vid){try{WL.vid.pause()}catch(e){}}}
async function wlAcquire(){
  WL.want=true;
  if(WL.lock&&!WL.lock.released)return true;
  if('wakeLock' in navigator&&navigator.wakeLock&&navigator.wakeLock.request){
    try{
      const l=await navigator.wakeLock.request('screen');
      if(!WL.want){try{l.release()}catch(e){}return false}    // слухання вже зупинили, поки чекали
      WL.lock=l;wlVideoStop();
      // Система знімає блокування сама, коли вкладка ховається: після повернення візьмемо знову (visibilitychange)
      holdSt('Екран не гасне (Wake Lock)');return true;
    }catch(e){}
  }
  if(wlVideoStart()){holdSt('Екран не гасне (запасний режим)');return true}
  holdSt('Не вдалося заборонити вимкнення екрана: збільшіть час автовимкнення в налаштуваннях телефона');return false;
}
function wlRelease(){
  WL.want=false;
  try{if(WL.lock)WL.lock.release()}catch(e){}
  WL.lock=null;wlVideoStop();holdSt('');
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  if(ctx&&ctx.state!=='running'&&ctx.state!=='closed')ctx.resume().catch(()=>{});
  if(liveStream&&liveStream.getAudioTracks().every(t=>t.readyState==='ended')){liveStop();return}   // система забрала мікрофон у фоні
  if(WL.want)wlAcquire();
});
// Перший дотик на сторінці розблоковує аудіо (правило автозапуску)
document.addEventListener('pointerup',()=>{if(ctx&&ctx.state!=='running'&&ctx.state!=='closed')ctx.resume().catch(()=>{})},true);

// ===== Розпізнавання з файлу (іконка) =====
async function decodeFile(f) {
  ui.set('decoding'); ui.anim(true); ui.status('Розпізнаю запис');
  try {
    log(`\n-- Розкодування: ${f.name} --`);
    let x;
    try { ac(); x = mono(await ctx.decodeAudioData(await f.arrayBuffer())) }
    catch (e) { log('ПОМИЛКА: не вдалось декодувати файл'); ui.say('Не вдалося відкрити цей файл. Спробуйте інший аудіозапис.'); return }
    const its = await decodeSig(x, P());
    log(`Знайдено колін: ${its.length}\n№ | час, с | символ | запас × | другий варіант`);
    if (its.skipped.length) log(`Відкинуто коротких звуків (клацання, шум): ${its.skipped.length}`);
    its.forEach((it, i) => log(`${pad(i + 1)} | ${it.t0.toFixed(2)}–${it.t1.toFixed(2)} | ${sy(it.sym)} | ${rt(it.ratio)}${it.ratio < LOW_CONF ? ' ⚠ СУМНІВНО' : ''} | ${sy(it.second)}`));
    const text = its.map(i => i.sym).join('');
    log(`Текст: «${text}»`);
    if (!text || /^\?+$/.test(text)) ui.say('У цьому записі не вдалося розпізнати спів. Спробуйте інший файл.');
    else ui.say(text);
  } catch (e) {
    log('ПОМИЛКА розкодування: ' + (e && e.message || e));
    ui.say('Щось пішло не так під час розпізнавання запису. Спробуйте ще раз.');
  } finally {
    ui.anim(false); ui.set('idle');
  }
}

// ===== Кнопки =====
let pending = false, cancelStart = false;
els.btn.addEventListener('click', async function () {
  if (pending) { cancelStart = true; ui.listening(false); return }   // передумали, поки чекали мікрофон
  if (ui.state === 'listening') { liveStop(); return }
  if (ui.state !== 'idle') return;
  pending = true; cancelStart = false;
  ui.listening(true); ui.status('Вмикаю мікрофон');                  // кнопка натиснута: соловей співає одразу
  let ok = false;
  try { ok = await liveStart() }
  catch (e) {
    log('ПОМИЛКА: ' + (e && e.message || e));
    try { liveStop() } catch (_) {}
    ui.say('Не вдалося почати слухання. Спробуйте ще раз.');
  }
  pending = false;
  if (cancelStart) { if (ok) { try { liveStop() } catch (_) {} } return }
  if (!ok) ui.listening(false);        // не вийшло: кнопка й соловей вимикаються, повідомлення лишається
});
els.file.addEventListener('click', function () { if (ui.state === 'idle') els.pick.click() });
els.pick.addEventListener('change', function () {
  const f = els.pick.files[0]; els.pick.value = '';
  if (f) decodeFile(f);
});

// ===== Дані для розпізнавання: файл solovey-score.json лежить поруч зі сторінкою =====
const SCORE_URL = 'solovey-score.json';
async function buildFromScore(o,name){
  ac();const sr=ctx.sampleRate,p=P();bank=buildBank(sr);lib=null;
  log(`\n-- Бібліотека з партитури: ${name} --`);
  if(o.sr!==sr){log(`ПОМИЛКА: дані для ${o.sr} Гц, а цей пристрій дає ${sr} Гц`);ui.fail(`Цей пристрій поки не підтримується: його звук працює в іншій якості (${sr} замість ${o.sr} Гц).`);return}
  const fx=o.fx,sc={fft:o.fft,hop:o.hop,maxAmp:o.maxAmp},L={};
  // Роздільник «~» додається до абетки лише коли він є в партитурі; без нього все працює як раніше
  {const i=SYMS.indexOf(SEP),has=!!(o.t&&o.t[SEP]);
   if(has&&i<0)SYMS.push(SEP);else if(!has&&i>=0)SYMS.splice(i,1);
   log(has?`Роздільник «${SEP}» знайдено в партитурі: додається в кінець закодованого тексту`:`Роздільника «${SEP}» у партитурі немає (додайте коліно з ключем «${SEP}», щоб він звучав у кінці тексту)`)}
  log(`Налаштування звуку з партитури: гучність ${fx.safePeak}, дзвінкість ${fx.brightGain}× від ${fx.brightHz} Гц, відлуння ${fx.roomMix} / ${fx.roomSec} с, приглушення ${fx.compThresh} / ${fx.compPower}`);
  for(let n=0;n<SYMS.length;n++){
    const s=SYMS[n],t=o.t&&o.t[s];
    const fail=m=>{log('ПОМИЛКА: '+m);ui.fail("Не вдалося підготувати розпізнавання. Оновіть сторінку й спробуйте ще раз.")};
    if(!t){fail(`у партитурі немає символу «${sy(s)}»`);return}
    try{
      let y=await roomify(synthKnee(readLines(t.d,t.n,o.maxAmp,2),t.len,fx,sc,sr),fx,sr);
      // Короткі плавні краї кліпу (20 мс): хвіст відлуння обрізається по межі кліпу без клацання
      const fd=Math.round(.02*sr);
      for(let i=0;i<fd&&i<y.length;i++){const k=i/fd;y[i]*=k;y[y.length-1-i]*=k}
      // Вирівнювання гучності
      const V=lvl(y,sr);
      let g=Math.min(Math.pow(10,(p.tgt-V.r50)/20),p.pmax/(V.pk+1e-9),Math.pow(10,p.boost/20));if(!(g>0&&isFinite(g)))g=1;
      for(let i=0;i<y.length;i++)y[i]*=g;
      // Відбиток для розпізнавання: найдовше коліно кліпу
      const kn=(await findKnees(y,sr,p)).kn;
      if(!kn.length){fail(`у синтетичному кліпі «${sy(s)}» не знайдено коліна`);return}
      let m=kn[0];for(const q of kn)if(q.se-q.ss>m.se-m.ss)m=q;
      const sf=segFeat(y,sr,m),ft=sf.ft;
      if(!ft){fail(`синтетичний кліп «${sy(s)}» закороткий (коліно ${((m.se-m.ss)/sr).toFixed(2)} с)`);return}
      // Ще три фази кадрової сітки шаблону (зсув старту на 5, 10, 15 мс): рахуються один раз тут, а не на кожному живому коліні
      const fts=[];for(let j=1;j<4;j++){const f=features(y.subarray(sf.a+j*Math.round(sr*.005),sf.z),sr);if(f)fts.push(f)}
      L[s]={idx:t.idx,y,ft,fts};
    }catch(e){fail(`«${sy(s)}»: ${e.message}`);return}
    if(n%2===1||n===SYMS.length-1){ui.progress((n+1)/SYMS.length);log(`... ${n+1} з ${SYMS.length}`);await new Promise(r=>setTimeout(r))}
  }
  lib=L;
  log(`Бібліотека готова: ${SYMS.length} символів`);
}

async function loadScore() {
  ui.progress(0);
  if (!(window.AudioContext || window.webkitAudioContext)) {
    ui.fail('Цей браузер не вміє працювати зі звуком. Спробуйте інший.'); return;
  }
  let o, r;
  try { r = await fetch(SCORE_URL, { cache: 'no-cache' }) }
  catch (e) {
    log(`Не вдалось завантажити ${SCORE_URL}: ${e.message}`);
    ui.fail(location.protocol === 'file:'
      ? 'Відкрийте сторінку через сайт, а не як файл із диска: так вона не зможе завантажити все потрібне.'
      : 'Не вдалося завантажити все потрібне для розпізнавання. Перевірте інтернет і оновіть сторінку.');
    return;
  }
  if (!r.ok) {
    log(`Не вдалось завантажити ${SCORE_URL}: HTTP ${r.status}`);
    ui.fail('Не вдалося знайти потрібні для розпізнавання дані. Спробуйте пізніше.');
    return;
  }
  try { o = await r.json() }
  catch (e) {
    log(`Файл ${SCORE_URL} не вдалося прочитати: ${e.message}`);
    ui.fail('Дані для розпізнавання пошкоджені. Спробуйте пізніше.');
    return;
  }
  try { await buildFromScore(o, SCORE_URL) }
  catch (e) {
    log('ПОМИЛКА: ' + (e && e.message || e));
    ui.fail('Не вдалося підготувати розпізнавання. Оновіть сторінку й спробуйте ще раз.');
    return;
  }
  if (lib) ui.ready();   // про невдачу побудови buildFromScore повідомляє сам
}
loadScore();
</script>
</body>
</html>
